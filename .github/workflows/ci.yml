name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Install browsers
        run: pnpm --filter @tasan/e2e exec playwright install --with-deps chromium firefox webkit

      - name: Start isolated E2E database
        id: e2e-db
        run: docker compose -f packages/e2e/compose.yml up --detach

      - name: Test browser flows
        run: pnpm --filter @tasan/e2e test:e2e

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop isolated E2E database
        if: always() && steps.e2e-db.outcome == 'success'
        run: docker compose -f packages/e2e/compose.yml down
