packages:
  - "packages/*"

allowBuilds:
  esbuild: true

overrides:
  "@types/node": "catalog:"

catalog:
  "@types/node": ^24.19.2
  # TypeScript 7 provides `tsc` but no JS API yet, so tools such as
  # typescript-eslint use the TypeScript 6 API through the `typescript` alias.
  "@typescript/native": npm:typescript@~7.0.2
  react-router: ^8.5.2
  typescript: npm:@typescript/typescript6@^6.0.2
