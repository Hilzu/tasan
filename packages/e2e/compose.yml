name: tasan-e2e

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --silent --output /dev/null http://127.0.0.1:8000"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
